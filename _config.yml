# ---------------------------------------------------------------------------
# CMS.100 Introduction to Media Studies — Fall 2026
# Built with Jekyll + the Just the Docs theme, deployed on GitHub Pages.
# ---------------------------------------------------------------------------

title: CMS.100
tagline: Introduction to Media Studies
description: Course website for CMS.100 Introduction to Media Studies (Fall 2026) at MIT
author: Crystal Lee
exclude: ["Gemfile", "Gemfile.lock", "LICENSE", "README.md"]

# If you publish to an org/user site (e.g. cms100-mit.github.io) leave baseurl
# empty. If you publish to a project repo (e.g. crystaljjlee/cms100), set
# baseurl to "/cms100" so that CSS and internal links resolve.
url: https://cms100-mit.github.io
baseurl: ""

# Theme settings
remote_theme: just-the-docs/just-the-docs@v0.8.2
color_scheme: cms100
search_enabled: true
heading_anchors: true
permalink: pretty

aux_links:
  Canvas:
    - 'https://canvas.mit.edu/courses/40342'
  Email me:
    - 'mailto:crystall@mit.edu'

footer_content: 'CMS.100 · Fall 2026 · Wednesdays &amp; Fridays · <a href="/acknowledgements/">Acknowledgements</a>. Materials are free to share and adapt with attribution.'

# Collections for website data
collections:
  staffers:
  modules:
  schedules:
  announcements:

defaults:
  - scope:
      path: ''
      type: staffers
    values:
      layout: staffer
      height: 300
      subpath: '/assets/images/'
      width: 300
  - scope:
      path: ''
      type: modules
    values:
      layout: module
  - scope:
      path: ''
      type: schedules
    values:
      layout: schedule
  - scope:
      path: ''
      type: announcements
    values:
      layout: announcement

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false

liquid:
  error_mode: strict
  strict_filters: true

callouts:
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  fyi:
    title: FYI
    color: blue
  important:
    title: Important
    color: yellow
  registrar:
    title: Registrar date
    color: grey-dk
  holiday:
    title: No class
    color: grey-dk
  tbd:
    title: Coming soon
    color: red
  caveat:
    title: Caveat
    color: red
  further:
    title: Going further
    color: green
  summary:
    title: Summary
    color: grey-dk
  released:
    title: Assignment released
    color: green
  due:
    title: Assignment due
    color: blue
  milestone:
    title: Milestone date
    color: blue
